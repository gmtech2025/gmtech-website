backend:
  name: github
  repo: gmtech2025/gmtech-website
  branch: main
  base_url: https://gmtech-decap-auth.ndlamvn.workers.dev
  auth_endpoint: /auth

site_url: https://gmtech.win
display_url: https://gmtech.win
locale: vi

media_folder: "assets/uploads"
public_folder: "/assets/uploads"


collections:
  - name: "products"
    label: "Sản phẩm"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Tên sản phẩm", name: "title", widget: "string" }
      - { label: "Mã sản phẩm", name: "sku", widget: "string", required: false }
      - { label: "Danh mục", name: "category", widget: "select", options: ["Laptop", "Máy tính để bàn", "Linh kiện", "Phụ kiện", "Thiết bị mạng", "Khác"] }
      - { label: "Mô tả ngắn", name: "description", widget: "text" }
      - { label: "Ảnh", name: "image", widget: "image", required: false }
      - { label: "CPU (thông số nhanh)", name: "cpu", widget: "string", required: false }
      - { label: "RAM (thông số nhanh)", name: "ram", widget: "string", required: false }
      - { label: "Ổ lưu trữ (thông số nhanh)", name: "storage", widget: "string", required: false }
      - { label: "Màn hình (thông số nhanh)", name: "display", widget: "string", required: false }
      - { label: "Giá hiển thị (để trống nếu chưa xác nhận)", name: "price", widget: "string", required: false }
      - { label: "Tình trạng", name: "availability", widget: "select", options: [{label: "Chưa xác nhận", value: "unconfirmed"}, {label: "Còn hàng (đã xác nhận)", value: "in-stock"}, {label: "Liên hệ", value: "contact"}] }
      - { label: "Nhãn minh họa", name: "is_sample", widget: "boolean", default: false, required: false }
      - { label: "Hiển thị trên website", name: "published", widget: "boolean", default: true }
      - { label: "Nội dung chi tiết", name: "body", widget: "markdown" }

  - name: "services"
    label: "Dịch vụ"
    folder: "content/services"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Tên dịch vụ", name: "title", widget: "string" }
      - { label: "Nhóm dịch vụ", name: "category", widget: "select", options: ["IT Outsourcing", "Hạ tầng mạng", "An toàn thông tin", "Máy chủ & lưu trữ", "Sửa chữa & bảo trì", "Phần mềm & tự động hóa", "Đào tạo"] }
      - { label: "Mô tả ngắn", name: "description", widget: "text" }
      - { label: "Biểu tượng (ký tự)", name: "icon", widget: "string", required: false }
      - { label: "Nhãn minh họa", name: "is_sample", widget: "boolean", default: false, required: false }
      - { label: "Hiển thị trên website", name: "published", widget: "boolean", default: true }
      - { label: "Nội dung chi tiết", name: "body", widget: "markdown" }

  - name: "posts"
    label: "Bài viết"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Tiêu đề", name: "title", widget: "string" }
      - { label: "Ngày đăng", name: "date", widget: "datetime" }
      - { label: "Mô tả ngắn", name: "description", widget: "text" }
      - { label: "Ảnh đại diện", name: "thumbnail", widget: "image", required: false }

      - label: "Danh mục cha"
        name: "category_parent"
        widget: "select"
        required: false
        options:
          - { label: "Quản trị hệ thống & mạng", value: "quan-tri-mang" }
          - { label: "Sửa chữa & phần cứng", value: "sua-chua-phan-cung" }
          - { label: "An toàn thông tin", value: "an-toan-thong-tin" }
          - { label: "Giải pháp CNTT doanh nghiệp", value: "giai-phap-doanh-nghiep" }
          - { label: "Phần mềm, AI & tự động hóa", value: "ai-tu-dong-hoa" }
          - { label: "Đào tạo & hướng dẫn", value: "dao-tao" }

      - { label: "Danh mục con", name: "category_child", widget: "string", required: false }

      - label: "Thẻ bài viết"
        name: "tags"
        widget: "list"
        required: false
        field: { label: "Tên thẻ", name: "tag", widget: "string" }

      - { label: "Danh mục cũ (tương thích dữ liệu)", name: "category", widget: "string", required: false }

      - { label: "Nội dung", name: "body", widget: "markdown" }
